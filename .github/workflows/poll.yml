name: MI NEXUS Bot Poll

on:
  schedule:
    # GitHub Actions HARD-enforces a 5-minute minimum on scheduled cron.
    # Anything shorter (*/2, */3...) is silently ignored - it will never
    # fire, with no error shown anywhere. */5 is the fastest that actually
    # works. Also: an odd, off-peak minute (here :02/:07/:12...) avoids the
    # :00/:15/:30 congestion windows where GitHub queues/delays/drops runs.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

concurrency:
  group: mi-nexus-bot-poll
  cancel-in-progress: false   # never kill a run mid-job; let it finish and commit state

permissions:
  contents: write   # needed to commit updated state/queue files back to the repo

jobs:
  poll-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MI NEXUS bot cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m bot.run

      - name: Commit updated state/queue back to repo
        run: |
          git config user.name "mi-nexus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/queue.json data/bot.log || true
          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"
          git push || echo "Nothing to push or push failed (will retry next run)"
