name: MI NEXUS Watchdog

on:
  schedule:
    # Checks frequently so the gap between one loop.yml job ending and
    # the next starting stays small. 5 min is GitHub's real floor.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  check-and-restart:
    runs-on: ubuntu-latest
    steps:
      - name: Check if loop workflow is currently running
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          RUNNING=$(gh run list --workflow=loop.yml --repo "$REPO" --status in_progress --limit 1 --json databaseId --jq 'length')
          QUEUED=$(gh run list --workflow=loop.yml --repo "$REPO" --status queued --limit 1 --json databaseId --jq 'length')
          echo "running=$RUNNING" >> "$GITHUB_OUTPUT"
          echo "queued=$QUEUED" >> "$GITHUB_OUTPUT"
          echo "loop.yml in_progress=$RUNNING queued=$QUEUED"

      - name: Trigger loop workflow if not running and not queued
        if: steps.check.outputs.running == '0' && steps.check.outputs.queued == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "No active loop.yml run found - starting one."
          gh workflow run loop.yml --repo "$REPO"
